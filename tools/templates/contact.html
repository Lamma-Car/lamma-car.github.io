  <section aria-labelledby="who">
    <div class="person">
      <div class="monogram" aria-hidden="true"><span class="ar">{{INITIAL_AR}}</span><span class="en">{{INITIAL_EN}}</span></div>
      <p class="eyebrow"><span class="ar">تواصل مع صاحب السيارة</span><span class="en">Contact the vehicle owner</span></p>
    </div>
    <h1 class="name" id="who"><span class="ar">{{NAME_AR}}</span><span class="en">{{NAME_EN}}</span></h1>
    <p class="phone">{{PHONE_DISPLAY}}</p>
    <div class="actions">
      <a class="btn btn-call" href="tel:{{TEL}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        <span class="ar">اتصال مباشر</span><span class="en">Call now</span>
      </a>
{{WHATSAPP}}
    </div>
  </section>
