<script>
(function(){var d=document.documentElement,l="ar";try{var q=new URLSearchParams(location.search).get("lang");if(q==="en"||q==="ar"){l=q}else{var s=localStorage.getItem("lamma-lang");if(s==="en"||s==="ar")l=s}}catch(e){}d.lang=l;d.dir=l==="ar"?"rtl":"ltr";document.title=d.getAttribute("data-title-"+l);})();

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>
        <span>WhatsApp</span>

  </div>

<footer class="foot"><span class="ar">لمّة كار · صفحة تواصل عبر ملصق QR</span><span class="en">Lamma Car · QR sticker contact page</span></footer>
<script>
document.getElementById("lang").addEventListener("click",function(){var d=document.documentElement,l=d.lang==="ar"?"en":"ar";d.lang=l;d.dir=l==="ar"?"rtl":"ltr";document.title=d.getAttribute("data-title-"+l);try{localStorage.setItem("lamma-lang",l)}catch(e){}});
